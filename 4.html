<!DOCTYPE html>
<html lang="or">
<head>

<title>ସର୍ବନାମ ମାଇଣ୍ଡ ମ୍ୟାପ୍ (ପୃ.୪୫–୫୦)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&display=swap">
<style>
:root{--bg:#fafaf7;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#e3e3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Oriya","Kalinga","Nirmala UI",system-ui,sans-serif;font-size:15px;line-height:1.7;padding:14px 12px 40px}
h1{font-size:18px;margin:0 0 10px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:4px 14px;cursor:pointer}
button.on{background:#6c5ce7;color:#fff;border-color:#6c5ce7}
.root{display:block;width:fit-content;max-width:100%;margin:0 auto 12px;background:#6c5ce7;color:#fff;font-weight:700;padding:8px 18px;border-radius:24px;text-align:center}
.n{position:relative}
.t{display:inline-block;padding:2px 10px;border-radius:8px;margin:2px 0;background:var(--card);border:1px solid var(--bd)}
.t.p{cursor:pointer}
.t.p::after{content:" ▾";color:var(--mut);font-size:12px}
.n.c>.t.p::after{content:" ▸"}
.k{margin-left:14px;padding-left:12px;border-left:2px solid var(--c,var(--bd))}
.n.c>.k{display:none}
.k>.n::before{content:"";position:absolute;left:-12px;top:15px;width:10px;border-top:2px solid var(--c,var(--bd))}
.b{margin-bottom:10px}
.b>.t{background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.b>.t.p::after{color:#fff}
.b>.k{border-left-color:var(--c)}
.b .n{--c:inherit}
.b .k,.b .k>.n::before{--cc:var(--c)}
.b .k{border-left-color:var(--c)}
.b .k>.n::before{border-top-color:var(--c)}
.b .t{border-color:var(--c)}
.b>.t{border-color:var(--c)}
</style>
</head>
<body>
<h1>ସର୍ବନାମ — ମାଇଣ୍ଡ ମ୍ୟାପ୍</h1>
<div class="bar">
<button id="ex">ସବୁ ଖୋଲ</button>
<button id="co">ସବୁ ବନ୍ଦ</button>
</div>
<div id="app"></div>
<script>
var D={1:["ସର୍ବନାମ (ପୃ. ୪୫–୫୦)",[
["ସର୍ବନାମର ଧାରଣା",[
["'ପ୍ରସନ୍ନ ଭଲ ପାଠ ପଢ଼େ। ପ୍ରସନ୍ନ ପାଠପଢ଼ା ସହିତ ଭଲ ଖେଳେ...' — ଚାରିଟି ବାକ୍ୟରେ 'ପ୍ରସନ୍ନ' ଶବ୍ଦଟି ବାରମ୍ବାର ପ୍ରୟୋଗ; ଏହାଦ୍ୱାରା ପୁନରୁକ୍ତି ଓ ଶ୍ରୁତିକଟୁ ଦୋଷ ହୁଏ।"],
["ଏହି ଦୋଷକୁ ପରିହାର କରି ଲେଖିଲେ : 'ପ୍ରସନ୍ନ ଭଲ ପାଠ ପଢ଼େ। ସେ ପାଠପଢ଼ା ସହିତ ଭଲ ଖେଳେ। ତେଣୁ ତା'ର ସାଥୀମାନେ ତାକୁ ଆଦର କରନ୍ତି। ତା'ଠାରେ ମଧ୍ୟ ଆହୁରି ଅନେକ ଭଲଗୁଣ ଅଛି।'"],
["ପ୍ରସନ୍ନ ସ୍ଥାନରେ ସେ, ତା'ର, ତାକୁ ଓ ତା'ଠାରେ ପଦ ବସିଅଛି।"],
["ଏକ ପଦ ପରିବର୍ତ୍ତେ ଯେଉଁ ପଦ ବ୍ୟବହାର କରାଯାଏ, ତାକୁ ସର୍ବନାମ କହନ୍ତି।"],
["ସର୍ବନାମ ପଦ ବାକ୍ୟର ପୁନରୁକ୍ତି ଓ ଶ୍ରୁତିକଟୁ ଦୋଷ ଦୂର କରି ତାହାର ଶ୍ରୁତିମଧୁରତା ଓ ସୌନ୍ଦର୍ଯ୍ୟ ବୃଦ୍ଧି କରିଥାଏ।"]]],
["ସର୍ବନାମ ପଦର ବ୍ୟବହାର",[
["ସାଧାରଣତଃ ବିଶେଷ୍ୟ ପଦ ବଦଳରେ ସର୍ବନାମ ପଦ ବସେ; ମାତ୍ର କେତେକ କ୍ଷେତ୍ରରେ ବିଶେଷଣ, ବାକ୍ୟାର୍ଥ ବା ବାକ୍ୟ ପରିବର୍ତ୍ତେ ବ୍ୟବହୃତ ହୋଇଥାଏ।"],
["୧. ବିଶେଷ୍ୟ ପରିବର୍ତ୍ତେ : ଈଶ୍ୱର ଦୟାଳୁ। ସେ ସର୍ବମଙ୍ଗଳକାରୀ। — 'ସେ' = 'ଈଶ୍ୱର'"],
["୨. ବିଶେଷଣ ପରିବର୍ତ୍ତେ : ପିତା ଚତୁର, କିନ୍ତୁ ପୁତ୍ର ସେପରି ନୁହେଁ। ବିଭୀଷଣ ଧାର୍ମିକ ଥିଲେ, ମାତ୍ର ରାବଣ ତାହା ନ ଥିଲେ। — 'ସେପରି' ଓ 'ତାହା'"],
["୩. ବାକ୍ୟ ପରିବର୍ତ୍ତେ : ପଣ୍ଡିତ ଜବାହରଲାଲ ନେହେରୁ ଜଣେ ପ୍ରବୀଣ ରାଜନୀତିଜ୍ଞ ଥିଲେ, ଆଜି ମଧ୍ୟ ଲୋକେ ଏହା ସ୍ୱୀକାର କରୁଛନ୍ତି। — 'ଏହା'"],
["୪. ବାକ୍ୟାର୍ଥ ପରିବର୍ତ୍ତେ : କବି ଜୟଦେବ ଜଗନ୍ନାଥଙ୍କର ପରମ ଭକ୍ତ, ଏହା କାହାକୁ ଅଜଣା ନାହିଁ। — 'ଏହା'"]]],
["ସର୍ବନାମର ଶ୍ରେଣୀ ବିଭାଗ",[
["୧. ପୁରୁଷବାଚକ ବା ବ୍ୟକ୍ତିବାଚକ ସର୍ବନାମ",[
["ମୁଁ, ଆମେ, ଆମ୍ଭେମାନେ, ତୁ, ତୁମେ, ତୁମ୍ଭେମାନେ, ସେ, ସେମାନେ, ଆପଣ ଓ ଆପଣମାନେ — ବିଭିନ୍ନ ପୁରୁଷର ବ୍ୟକ୍ତିମାନଙ୍କ ବଦଳରେ ବ୍ୟବହୃତ। ଏହା ତିନି ଭାଗରେ ବିଭକ୍ତ।"],
["ପ୍ରଥମ ପୁରୁଷ : ମୁଁ ଜଣେ ଛାତ୍ର। ଆମ୍ଭେମାନେ ଭାରତବାସୀ।"],
["ଦ୍ୱିତୀୟ ପୁରୁଷ : ତୁ ସତ କହୁଛୁ। ତୁମ୍ଭେମାନେ ବ୍ୟାୟାମ କର। ତୁମେ ମୋର ବନ୍ଧୁ। ଆପଣ ମୋ କଥା ଶୁଣନ୍ତୁ।"],
["ତୃତୀୟ ପୁରୁଷ : ସେ ମୋର ଭାଇ। ସେମାନେ ଗ୍ରାମବାସୀ।"],
["ମୁଁ, ଆମ୍ଭେମାନେ — ପ୍ରଥମ ପୁରୁଷ; ତୁ, ତୁମେ, ତୁମ୍ଭେମାନେ, ଆପଣ, ଆପଣମାନେ — ଦ୍ୱିତୀୟ ପୁରୁଷ; ଏ ଦୁଇ ପୁରୁଷକୁ ବାଦ୍ ଦେଲେ ଅନ୍ୟ ସମସ୍ତ ସର୍ବନାମ ତୃତୀୟ ପୁରୁଷର ଅନ୍ତର୍ଗତ।"]]],
["୨. ପ୍ରଶ୍ନବାଚକ ସର୍ବନାମ",[["ପ୍ରଶ୍ନ ପଚାରିବା ପାଇଁ ଉଦ୍ଦିଷ୍ଟ ସର୍ବନାମ ପଦ।"],["(କ) ଦେଶର ପ୍ରଧାନ ମନ୍ତ୍ରୀଙ୍କ ନାମ କ'ଣ? (ଖ) ତୁମେ କିଏ? (ଗ) କିଏ କହେ ଉତ୍କଳ ଦରିଦ୍ର? (ଘ) କେଉଁ ଗ୍ରାମରେ ତୁମର ଘର? (ଙ) ପିଲାମାନେ ସବୁଦିନ କେଉଁଠି ଖେଳୁଛନ୍ତି? (ଚ) ମୁଁ ଥାଉଥାଉ ତୁମର ଦୁଃଖ କାହିଁକି? (ଛ) ଆପଣ କାହାକୁ ଡାକୁଛନ୍ତି?"]]],
["୩. ନିର୍ଦ୍ଦେଶାତ୍ମକ ସର୍ବନାମ",[["ଯେଉଁ ସର୍ବନାମ ପଦ ବାକ୍ୟରେ ବ୍ୟବହୃତ ହୋଇ ବିଶେଷ୍ୟ ପଦମାନଙ୍କୁ ନିର୍ଦ୍ଦେଶ କରିଥାଏ।"],["(କ) ଏ ଲୋକଟି ଚରିତ୍ରବାନ୍। (ଖ) ଏହି ଗ୍ରାମରେ ମୋର ଜନ୍ମ। (ଗ) ସେ ମଣିଷ ନୁହେଁ। (ଘ) ସେହି ଶିକ୍ଷକ ନମସ୍ୟ। (ଙ) ତା' କଥା ମୋତେ କହନା।"]]],
["୪. ଆପେକ୍ଷିକ ବା ସମ୍ବନ୍ଧବାଚକ ସର୍ବନାମ",[["ଯେଉଁ ସର୍ବନାମ ପଦସମୂହ ବାକ୍ୟରେ ପରସ୍ପରକୁ ଅପେକ୍ଷା କରନ୍ତି ବା ସମ୍ବନ୍ଧ ସ୍ଥାପନ କରନ୍ତି।"],["ଯେ ଦେଶ ଯାଇ, ସେ ଫଳ ଖାଇ। | ଯାହା ଅନ୍ୟର ହିତକାରକ, ତାହା ହିଁ ମଙ୍ଗଳ। | ଯେତିକି ପାରୁଛ, ସେତିକି କାମ କର। | ଯେପରି କର୍ମ, ସେପରି ଫଳ। | ଯାହାର ଲୁଣ ଖାଇବ, ତାହାର ଗୁଣ ଗାଇବ।"],["ଯେ-ସେ, ଯାହା-ତାହା, ଯେତିକି-ସେତିକି, ଯେପରି-ସେପରି, ଯାହାର-ତାହାର ଆପେକ୍ଷିକ ସର୍ବନାମ।"]]],
["୫. ନିର୍ଣ୍ଣାୟକ ସର୍ବନାମ",[["ଯେଉଁ ସର୍ବନାମ ପଦ ବାକ୍ୟରେ ବ୍ୟବହୃତ ହୋଇ ବିଶେଷ୍ୟ ପଦକୁ ନିର୍ଣ୍ଣୟ କରିଥାଏ।"],["(କ) ରାକେଶ ଓ ଦିନେଶ ଦୁଇ ସାଙ୍ଗ, ଉଭୟେ ଭଲ ପାଠ ପଢ଼ନ୍ତି। (ଖ) ସଂସାରରେ ଯେତେ ଲୋକ ଅଛନ୍ତି, ପ୍ରତ୍ୟେକଙ୍କର ଚରିତ୍ର ସମାନ ନୁହେଁ। (ଗ) ତୁମେ ସବୁ କଥାରେ ମୁଣ୍ଡ ଖେଳାଅ ନାହିଁ। (ଘ) ଚୋରମାନେ ତାଙ୍କର ସମସ୍ତ ଧନସମ୍ପତ୍ତି ନେଇଗଲେ। (ଙ) ଅନ୍ୟ ଲୋକକୁ ସମ୍ମାନ ଦେଲେ ନିଜର ସମ୍ମାନ ବଢ଼େ। (ଚ) ଅପର ବ୍ୟକ୍ତିର ଦୁଃଖରେ ଯେ ଦୁଃଖୀ, ସେ ହିଁ ପ୍ରକୃତରେ ସାଧୁ। (ଛ) ଆର ଥରକୁ ଆରମ୍ଭ କରିବା।"]]],
["୬. ଆତ୍ମବାଚକ ସର୍ବନାମ",[["ବ୍ୟକ୍ତିବିଶେଷ ପରିବର୍ତ୍ତେ ବ୍ୟବହୃତ ନିଜ, ନିଜେ, ଆପେ, ଆପଣା ପ୍ରଭୃତି ସର୍ବନାମ ପଦ।"],["ଆପଣା କଲା କର୍ମମାନ, ଆଗୁ ହୋଇବ ସାବଧାନ। | କିଏ ତୁମେ ଚିହ୍ନିଛ କି ଆପଣାକୁ ଆପେ? | ନିଜର ଦୁଷ୍କୃତିପାଇଁ ନିଜେ ପ୍ରାୟଶ୍ଚିତ କରିବା ଦରକାର।"]]],
