<style>
:root{--bg:#fafaf7;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#e3e3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Oriya","Kalinga","Nirmala UI",system-ui,sans-serif;font-size:15px;line-height:1.7;padding:14px 12px 40px}
h1{font-size:18px;margin:0 0 10px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:4px 14px;cursor:pointer}
button.on{background:#6c5ce7;color:#fff;border-color:#6c5ce7}
.root{display:block;width:fit-content;max-width:100%;margin:0 auto 12px;background:#6c5ce7;color:#fff;font-weight:700;padding:8px 18px;border-radius:24px;text-align:center}
.n{position:relative}
.t{display:inline-block;padding:2px 10px;border-radius:8px;margin:2px 0;background:var(--card);border:1px solid var(--bd)}
.t.p{cursor:pointer}
.t.p::after{content:" ▾";color:var(--mut);font-size:12px}
.n.c>.t.p::after{content:" ▸"}
.k{margin-left:14px;padding-left:12px;border-left:2px solid var(--c,var(--bd))}
.n.c>.k{display:none}
.k>.n::before{content:"";position:absolute;left:-12px;top:15px;width:10px;border-top:2px solid var(--c,var(--bd))}
.b{margin-bottom:10px}
.b>.t{background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.b>.t.p::after{color:#fff}
.b>.k{border-left-color:var(--c)}
.b .n{--c:inherit}
.b .k,.b .k>.n::before{--cc:var(--c)}
.b .k{border-left-color:var(--c)}
.b .k>.n::before{border-top-color:var(--c)}
.b .t{border-color:var(--c)}
.b>.t{border-color:var(--c)}
</style>

var D={1:["ଲିଙ୍ଗ (ପୃ. ୬୨–୭୩)",[

["ଲକ୍ଷ୍ୟ କର : (କ) ନିରଞ୍ଜନ ଗୀତ ଗାଉଛି। (ଖ) ନୀଳିମା ଚିତ୍ର ଆଙ୍କୁଛି। (ଗ) ଛୁଆଟି ଶେଯରେ କାନ୍ଦୁଛି। (ଘ) କଲମଟି ତଳେ ପଡ଼ିଗଲା।"],
["'ନିରଞ୍ଜନ' ପୁରୁଷ ବା ବାଳକର ନାମ; 'ନୀଳିମା' ବାଳିକା ବା ସ୍ତ୍ରୀ ନାମ; 'ଛୁଆ' ପୁଅ-ଝିଅ ଉଭୟଙ୍କୁ ବୁଝାଏ; 'କଲମ' ଏକ ନିର୍ଜୀବ ବା ଅପ୍ରାଣୀବାଚକ ପଦ।"],

["ଲିଙ୍ଗ ଚାରି ପ୍ରକାର",[
["୧. ପୁଂଲିଙ୍ଗ : ଜଗନ୍ନାଥ, ଗୋପାଳ, ବାପା, ଭାଇ, ମାମୁ, ଯୁବକ, ପୁଅ, ବାଳକ, ଦେବ, ରାଜା, ସିଂହ, ବାଘ, ହାତୀ, ହରିଣ"],
["୨. ସ୍ତ୍ରୀଲିଙ୍ଗ : ଲକ୍ଷ୍ମୀ, ସାବିତ୍ରୀ, ବାଳିକା, ଝିଅ, ମା, ମାଈଁ, ଖୁଡ଼ୀ, ଆଇ, ଗାୟତ୍ରୀ, ସିଂହୀ, ହରିଣୀ, ମୟୂରୀ, ବାଘୁଣୀ"],
["୩. ଉଭୟଲିଙ୍ଗ : ଛୁଆ, ପିଲା, ଶିଶୁ, କୁଆ, କୋଇଲି, ଚଡ଼େଇ, ଛେଳି, ଗୋରୁ, କର୍ମୀ, ଯାତ୍ରୀ, ଲୋକ"],

["ଲିଙ୍ଗ ବିଚାର",[
["ବିଶେଷ୍ୟ, ସର୍ବନାମ ଓ ବିଶେଷଣ ପଦରେ ଲିଙ୍ଗ ବିଚାର କରାଯାଏ।"],
["ବିଶେଷ୍ୟ ପଦର ଅର୍ଥ ନେଇ ତାହା ଚାରି ଶ୍ରେଣୀର ଲିଙ୍ଗ ଭିତରୁ ଯେଉଁ ଶ୍ରେଣୀର ଅନ୍ତର୍ଗତ, ସ୍ଥିର କରାଯାଏ; ପଦର ପ୍ରକୃତିଗତ ଲିଙ୍ଗକୁ ଅନୁସରଣ କରି ଲିଙ୍ଗ ନିର୍ଣ୍ଣୟ।"],
["ସଂସ୍କୃତ ଭାଷାରେ ଲିଙ୍ଗ ନିର୍ଣ୍ଣୟ ଶବ୍ଦାର୍ଥକୁ ନେଇ ନୁହେଁ, ଶବ୍ଦର ବ୍ୟୁତ୍ପତ୍ତିକୁ ନେଇ : 'ଦେହ' ପୁଂଲିଙ୍ଗ, 'ତନୁ' ସ୍ତ୍ରୀଲିଙ୍ଗ, 'ଶରୀର' କ୍ଲୀବଲିଙ୍ଗ। ସେହିପରି ଦାର, ପତ୍ନୀ, କଳତ୍ର ଶବ୍ଦ ସ୍ତ୍ରୀବାଚକ ହେଲେ ମଧ୍ୟ କ୍ରମେ ପୁଂଲିଙ୍ଗ, ସ୍ତ୍ରୀଲିଙ୍ଗ ଓ କ୍ଲୀବଲିଙ୍ଗ।"],
["ବନ୍ଧୁ, ସଖା ପୁଂଲିଙ୍ଗ; ମିତ୍ର କ୍ଲୀବଲିଙ୍ଗ। 'ବୃକ୍ଷ', 'ପର୍ବତ' ସଂସ୍କୃତରେ ପୁଂଲିଙ୍ଗ, ଓଡ଼ିଆରେ ଅପ୍ରାଣୀବାଚକ ହେତୁ କ୍ଲୀବ। 'ଦେବତା' ସଂସ୍କୃତରେ ସ୍ତ୍ରୀଲିଙ୍ଗ, ଓଡ଼ିଆରେ ପୁଂଲିଙ୍ଗ (କାଳିଜାଇ ବଡ଼ ପ୍ରତ୍ୟକ୍ଷ ଦେବତା); ଦେବତାର ସ୍ତ୍ରୀଲିଙ୍ଗ 'ଦେବୀ' (ଗ୍ରାମଦେବତୀ, ବନଦେବତୀ)।"],
["ସର୍ବନାମ ପଦ ବିଶେଷ୍ୟ ପରିବର୍ତ୍ତେ ବ୍ୟବହୃତ ହେଉଥିବାରୁ ବିଶେଷ୍ୟର ଲିଙ୍ଗ ଗ୍ରହଣ କରେ : ସଦାନନ୍ଦ ଦଶମ ଶ୍ରେଣୀରେ ପଢ଼େ। ସେ ଶ୍ରେଣୀରେ ପ୍ରଥମ ହୁଏ। (ସେ = ପୁଂଲିଙ୍ଗ) | ସାବିତ୍ରୀ ସଙ୍ଗୀତ ଶିଖୁଛି, ସେ ମଧ୍ୟ ଭଲ ଖେଳୁଛି, ତାକୁ ସମସ୍ତେ ଭଲ ପାଆନ୍ତି। (ସେ, ତାକୁ = ସ୍ତ୍ରୀଲିଙ୍ଗ)"],
["ବିଶେଷଣ ପଦ ବିଶେଷ୍ୟ ପଦର ଲିଙ୍ଗକୁ ଅନୁସରଣ କରେ : ଧଳା ହାତୀଟି ଐରାବତ ଅଟେ। | କଳା ଗାଈଟି ପଡ଼ିଆରେ ଚରୁଛି।",[["ବ୍ୟତିକ୍ରମ : କାଳୀ ଗାଈର ଭିନ୍ନେ ଗୋଠ। | ଏଇ ପୁଅଟି ଗୋରା। | ଗୋରୀ ଝିଅଟି ଶ୍ୟାମବାବୁଙ୍କର।"],["ତତ୍ସମ ସଂସ୍କୃତ ଶବ୍ଦରେ ଲିଙ୍ଗ ପରିବର୍ତ୍ତନ ସଂସ୍କୃତ ନିୟମକୁ ଅନୁସରଣ କରେ : ସୁନ୍ଦର ବାଳକ, ଚତୁର ଶୃଗାଳ, ବେଗବାନ୍ ଅଶ୍ୱ, ଧନବାନ୍ ପୁରୁଷ, ଶାରଦୀୟ ଆକାଶ"],["ରୂପବତୀ ରମଣୀ, ବିଦୁଷୀ ନାରୀ, ପୁଷ୍ପିତା ଲତା, ଶିକ୍ଷିତା ଝିଅ, ବନ୍ଧ୍ୟା ଭୂମି, ଶୁକ୍ଳା ରଜନୀ, ଶାରଦୀୟା ସନ୍ଧ୍ୟା, ପୟସ୍ୱିନୀ ଗାଭୀ, ଓଜସ୍ୱିନୀ ବକ୍ତୃତା, ଦୁଃଖିନୀ ସୀତା, ମହୀୟସୀ ମହିଳା, ସ୍ନେହମୟୀ ଜନନୀ, ସୁନ୍ଦରୀ ସତ୍ୟଭାମା, ଶସ୍ୟଶ୍ୟାମଳା ଧରିତ୍ରୀ, ଗଭୀରା ନଦୀ, ପତିତପାବନୀ ଗଙ୍ଗା"],["ବ୍ୟତିକ୍ରମ (ସ୍ତ୍ରୀଲିଙ୍ଗ ବିଶେଷ୍ୟ ପୂର୍ବରେ ପୁଂ ଆକାରର ବିଶେଷଣ) : ବିପୁଳ ସମ୍ପତ୍ତି, ପ୍ରଚୁର କ୍ଷତି, ଅଦ୍ଭୁତ ନୀତି, କରାଳ ରଜନୀ"],["ବିଶେଷଣ ବିଧେୟ ହେଲେ ଲିଙ୍ଗ ଅନୁସରଣ ଇଚ୍ଛାଧୀନ : ଝିଅଟି ସୁନ୍ଦରୀ ବା ସୁନ୍ଦର। | ନାରୀମାନେ ପରାଧୀନ ବା ପରାଧୀନା।"],["ଓଡ଼ିଆରେ ଲିଙ୍ଗ ନିର୍ଣ୍ଣୟ ସଂସ୍କୃତ ପରି କଠୋର ନିୟମରେ ଆବଦ୍ଧ ନୁହେଁ; କେତେକ ବିଶେଷଣ ସମାନ ଭାବେ ବ୍ୟବହୃତ : ବଡ଼ ପୁଅ (ପୁଂ), ବଡ଼ ଝିଅ (ସ୍ତ୍ରୀ), ବଡ଼ ଘର (କ୍ଲୀବ); ସାନଭାଇ, ସାନ ଭଉଣୀ, ସାନ ନଣନ୍ଦ, ସାନ ଦିଅର, ସାନ ଦେଉଳ, ସାନ ଘର, ଛୋଟ ବହି"]]]]],
["ପୁଂଲିଙ୍ଗରୁ ସ୍ତ୍ରୀଲିଙ୍ଗ ପରିବର୍ତ୍ତନ ନିୟମ",[

["୧. ପ୍ରତ୍ୟୟ ଯୋଗରେ (ପୃ.୬୫–୭୧)",[

["(ଗ) 'ଇନ୍/ଇନୀ' ପ୍ରତ୍ୟୟ ଯୋଗ",[["କୁଶଳୀ→କୁଶଳିନୀ | ଧନୀ→ଧନିନୀ | କେକୀ→କେକିନୀ | ଗୁଣୀ→ଗୁଣିନୀ | ମାନୀ→ମାନିନୀ | ଜ୍ଞାନୀ→ଜ୍ଞାନିନୀ | କ୍ଷିପ୍ରକାରୀ→କ୍ଷିପ୍ରକାରିଣୀ | ପକ୍ଷୀ→ପକ୍ଷିଣୀ | କୌତୁକୀ→କୌତୁକିନୀ | ଗୃହୀ→ଗୃହିଣୀ | ଦୁଃଖୀ→ଦୁଃଖିନୀ | ବିଦେଶୀ→ବିଦେଶିନୀ"],["କ୍ଷେତ୍ରୀ→କ୍ଷେତ୍ରିଣୀ | ଗର୍ବୀ→ଗର୍ବିଣୀ | କରୀ→କରିଣୀ | ବିରହୀ→ବିରହିଣୀ | ହସ୍ତୀ→ହସ୍ତିନୀ | ମେଧାବୀ→ମେଧାବିନୀ | ଯଶସ୍ୱୀ→ଯଶସ୍ୱିନୀ | ଓଜସ୍ୱୀ→ଓଜସ୍ୱିନୀ | ତପସ୍ୱୀ→ତପସ୍ୱିନୀ | ତେଜସ୍ୱୀ→ତେଜସ୍ୱିନୀ | ବିଲାସୀ→ବିଲାସିନୀ | ମାୟାବୀ→ମାୟାବିନୀ | ଅନୁରାଗୀ→ଅନୁରାଗିଣୀ | ଅଧିକାରୀ→ଅଧିକାରିଣୀ | ପ୍ରିୟବାଦୀ→ପ୍ରିୟବାଦିନୀ | ଅଭିମାନୀ→ଅଭିମାନିନୀ | ଧନଶାଳୀ→ଧନଶାଳିନୀ | ବଳଶାଳୀ→ବଳଶାଳିନୀ"]]],
