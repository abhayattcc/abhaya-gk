<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&display=swap">
<style>
:root{--bg:#fafaf7;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#e3e3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Oriya","Kalinga","Nirmala UI",system-ui,sans-serif;font-size:15px;line-height:1.7;padding:14px 12px 40px}

.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:4px 14px;cursor:pointer}

.root{display:block;width:fit-content;max-width:100%;margin:0 auto 12px;background:#6c5ce7;color:#fff;font-weight:700;padding:8px 18px;border-radius:24px;text-align:center}

.n.c>.t.p::after{content:" ▸"}
.k{margin-left:14px;padding-left:12px;border-left:2px solid var(--c,var(--bd))}
.n.c>.k{display:none}
.k>.n::before{content:"";position:absolute;left:-12px;top:15px;width:10px;border-top:2px solid var(--c,var(--bd))}
.b{margin-bottom:10px}
.b>.t{background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.b>.t.p::after{color:#fff}
.b>.k{border-left-color:var(--c)}
.b .n{--c:inherit}
.b .k,.b .k>.n::before{--cc:var(--c)}
.b .k{border-left-color:var(--c)}
.b .k>.n::before{border-top-color:var(--c)}
.b .t{border-color:var(--c)}
.b>.t{border-color:var(--c)}
</style>

<h1>ଓଡ଼ିଆ ବ୍ୟାକରଣ — ମାଇଣ୍ଡ ମ୍ୟାପ୍</h1>

<script>
var D={1:["ଓଡ଼ିଆ ବ୍ୟାକରଣ : ଭାଷା, ଲିପି, ଧ୍ୱନି, ବର୍ଣ୍ଣ, ମାତ୍ରା, ଫଳା ଓ ଯୁକ୍ତାକ୍ଷର (ପୃ. ୧୦–୩୦)",[
["ଭାଷାର ଆବଶ୍ୟକତା (ପୃ.୧୦)",[
["ଭାବ ପ୍ରକାଶର ମାଧ୍ୟମ ଭାଷା; ଯେଉଁମାନଙ୍କର ଭାଷା ନାହିଁ, ସେମାନେ ମଣିଷ ନୁହନ୍ତି। ମଣିଷ ଭାଷାର ଅଧିକାରୀ ହେତୁ ଭାଗ୍ୟବାନ୍।"],
["ମଣିଷ ଜୀବନରେ ଦୁଇ କାରଣରୁ ଭାଷାର ଉପଯୋଗିତା :",[["ପ୍ରଥମତଃ ତା'ର ପ୍ରାଥମିକ ଚିନ୍ତାଟି ଭାଷା ମାଧ୍ୟମରେ ସାଧିତ ହୁଏ; ପ୍ରତ୍ୟେକ ମଣିଷ ନିଜ ମାତୃଭାଷାରେ ହିଁ ପ୍ରଥମେ ଚିନ୍ତା କରେ।"],["ଦ୍ୱିତୀୟରେ ସେ ତା'ର ଭାବକୁ ଅନ୍ୟ ନିକଟରେ ପ୍ରକାଶ କରିବାକୁ ଭାଷାର ସହାୟତା ଗ୍ରହଣ କରେ।"]]],
["ପ୍ରତ୍ୟେକ ଭାଷାର ଧ୍ୱନିଗୁଡ଼ିକର ଉଚ୍ଚାରଣ ପଦ୍ଧତି ଭିନ୍ନ। ଏହି ଧ୍ୱନିଗୁଡ଼ିକ ନିର୍ଦ୍ଦିଷ୍ଟ ନିୟମରେ ସଜ୍ଜିତ ହୋଇ ପ୍ରକାଶିତ ହେଲେ ଭାଷାର ରୂପ ଗ୍ରହଣ କରେ।"],
["ଭାଷାର ପରିସର ବ୍ୟାପକ; ଏହା ଏକ ପ୍ରବହମାନ ଧାରା। ପୃଥିବୀରେ ପ୍ରାୟ ପନ୍ଦର ହଜାରରୁ ଉର୍ଦ୍ଧ୍ୱ ଭାଷା ପ୍ରଚଳିତ; ସମୟକ୍ରମେ କିଛି ଲୋପ ପାଇଛି।"],
["ପ୍ରତ୍ୟେକ ଭାଷାର କେତେଗୁଡ଼ିଏ ଉପଭାଷା ମଧ୍ୟ ରହିଛି; ସେଥିରେ ଆଞ୍ଚଳିକ ପ୍ରୟୋଗର ଆଧିକ୍ୟ ପରିଲକ୍ଷିତ।"]]],
["ଓଡ଼ିଆ ଭାଷାର ଉତ୍ପତ୍ତି ଓ ବିକାଶ କ୍ରମ (ପୃ.୧୦–୧୧)",[
["ଭାରତୀୟ ସମ୍ବିଧାନ ସ୍ୱୀକୃତ ଭାଷାମାନଙ୍କ ମଧ୍ୟରେ ଓଡ଼ିଆ ଅନ୍ୟତମ। ମୂଳଉତ୍ସ : ଭାରତୀୟ ଆର୍ଯ୍ୟଭାଷା → ଇଣ୍ଡୋୟୁରୋପୀୟ ପରିବାର → ଇଣ୍ଡୋ-ଇରାନୀୟ ଶାଖା → ଭାରତୀୟ ଆର୍ଯ୍ୟ ଉପଶାଖା।"],
["ଭାରତୀୟ ଆର୍ଯ୍ୟଭାଷା ତିନି ସ୍ତର :",[
["ପ୍ରାଚୀନ ଭାରତୀୟ ଆର୍ଯ୍ୟଭାଷା (ଖ୍ରୀ.ପୂ. ୧୫୦୦–୫୦୦) : ବୈଦିକ ସଂସ୍କୃତ ଓ ଲୌକିକ ସଂସ୍କୃତ"],
["ମଧ୍ୟ ଭାରତୀୟ ଆର୍ଯ୍ୟଭାଷା (ଖ୍ରୀ.ପୂ. ୫୦୦–ଖ୍ରୀ. ୧୦୦୦) : କଥିତ ସଂସ୍କୃତରୁ ଜନ୍ମ, ତିନି ସ୍ତର",[["ପ୍ରଥମ : ପାଲିଭାଷା (ଖ୍ରୀ.ପୂ. ୫୦୦–୨୦୦)"],["ଦ୍ୱିତୀୟ : ପ୍ରାକୃତଭାଷା (ଖ୍ରୀ.ପୂ. ୨୦୦–ଖ୍ରୀ. ୫୦୦) — ମହାରାଷ୍ଟ୍ରୀ, ସୌରସେନୀ, ମାଗଧୀ, ପୈଶାଚୀ, ଅର୍ଦ୍ଧମାଗଧୀ"],["ତୃତୀୟ : ଅପଭ୍ରଂଶ ଭାଷା (ଖ୍ରୀ. ୫୦୦–୧୦୦୦)"]]],
["ଆଧୁନିକ ଭାରତୀୟ ଆର୍ଯ୍ୟଭାଷା (ଖ୍ରୀ. ୧୦୦୦ ଓ ପରବର୍ତ୍ତୀ)"]]],
["ମାଗଧୀ ପ୍ରାକୃତର ଶାଖା ପୂର୍ବୀ-ମାଗଧୀ ଅପଭ୍ରଂଶରୁ ଓଡ଼ିଆର ସୃଷ୍ଟି। ଏହା ଉତ୍ତର-ପୂର୍ବ ମାଗଧୀ (ବଙ୍ଗାଳୀ, ଆସାମୀ) ଓ ଦକ୍ଷିଣ-ପୂର୍ବ ମାଗଧୀ (ଓଡ଼ିଆ) ଦୁଇ ଭାଗରେ ବିଭକ୍ତ।"],
["ଦକ୍ଷିଣ-ପୂର୍ବ ମାଗଧୀ ଅପଭ୍ରଂଶର ଅନ୍ୟ ନାମ ଔଡ୍ରୀ ଅପଭ୍ରଂଶ; ଭରତଙ୍କ ନାଟ୍ୟଶାସ୍ତ୍ରର 'ଔଡ୍ରୀ ବିଭାଷା' ଏହାର ପୂର୍ବ ରୂପ।"],
["ପୂର୍ବୀ-ମାଗଧୀ ପ୍ରାକୃତର ଅଷ୍ଟ୍ରିକ ଓ ଦ୍ରାବିଡ଼ ଭାଷା ସହିତ ମିଶ୍ରଣରେ ଔଡ୍ରୀ ବିଭାଷାର ସୃଷ୍ଟି ବୋଲି ଅନୁମାନ।"],
["ସପ୍ତମ ଶତାବ୍ଦୀ ବେଳକୁ ସ୍ୱତନ୍ତ୍ର ରୂପ (ଚୀନ୍ ପରିବ୍ରାଜକ ହ୍ୟୁଏନ୍‌ସାଙ୍ଗଙ୍କ ବିବରଣୀ); ଉତ୍କଳ ଅତୀତରେ ଓଡ୍ର ଦେଶ। ସୌରସେନୀ ଓ ଶବର ଭାଷାର ମିଶ୍ରଣରୁ ଔଡ୍ରୀ ଅପଭ୍ରଂଶ; ପ୍ରାଚୀନ ଓଡ଼ିଆ = ଆର୍ଯ୍ୟ, ଦ୍ରାବିଡ଼, ଅଷ୍ଟ୍ରିକ ଗୋଷ୍ଠୀ ଭାଷାର ମିଳନ।"],
["ପ୍ରାଚୀନ ଅଭିଲେଖ : ମାଧବ ବର୍ମାଙ୍କ ତାମ୍ରଶାସନ, ଅନନ୍ତ ଦେବ ବର୍ମାଙ୍କ ତାମ୍ରଶାସନ, ଉରଜାମ୍ ଶିଳାଲେଖ, ଦ୍ୱିତୀୟ ନରସିଂହ ଦେବଙ୍କ ଶିଳାଲେଖ, ତ୍ରିମାଳା ତାମ୍ରଶାସନ, ଚତୁର୍ଥ ନରସିଂହ ଦେବଙ୍କ ପୁରୀ ଶଙ୍କରାନନ୍ଦ ମଠ ତାମ୍ର ଫଳକ ଓ ଯାଜପୁର ସିଦ୍ଧେଶ୍ୱର ମନ୍ଦିର ସ୍ତମ୍ଭ ଅଭିଲେଖ।"]]],
["ଚର୍ଯ୍ୟାଗୀତିକା (ସପ୍ତମ/ଅଷ୍ଟମ ଶତକ) (ପୃ.୧୨)",[
["୮୪ ସିଦ୍ଧାର୍ଯ୍ୟମାନଙ୍କ ମଧ୍ୟରୁ କେତେକ ଓଡ଼ିଶାର ଲୋକ; ତେଣୁ ଚର୍ଯ୍ୟାଗୀତିକାରେ ଓଡ଼ିଆ ଭାଷାର ବହୁ ଶବ୍ଦ ପରିଲକ୍ଷିତ।"],
["ଶବ୍ଦ ଉଦାହରଣ : ଅନୁଦିନ, ଅନ୍ଧାର, ଆଜି, ଏକେଲି, କାହ୍ନୁ, ଖାଇବ, ଖେଲ, ଘୋରି, ଚାରି, ଜାହେର, ଠାକୁର, ତୋହରି, ଦେଖଇ, ନାଚ, ମୋର, ହାଣ୍ଡି, ହୋଇ ଇତ୍ୟାଦି"],
["ଚର୍ଯ୍ୟାକାର : ଲୁଇପାଦ, ଶବରୀ ପାଦ, କାହ୍ନୁପାଦ — ଏହି ସ୍ଥିତିରେ ଓଡ଼ିଆ ଭାଷା ନିରାପଦ ପହଞ୍ଚିସାରିଥିଲା।"]]],
["ପଞ୍ଚଦଶ ଶତାବ୍ଦୀ : ସାରଳା ଦାସ (ପୃ.୧୩–୧୪)",[
["ଅରୁଣୋଦୟ କାଳରେ ସାରଳାଦାସ ଭାଷାକୁ ବିରାଟ ଭିତ୍ତିଭୂମି ପ୍ରଦାନ କଲେ; ମହାଭାରତ, ଚଣ୍ଡୀପୁରାଣ, ବିଳଙ୍କା ରାମାୟଣ ଆଦି ରଚନା।"],
["ଲୋକକଥିତ ଭାଷା ସାହିତ୍ୟିକ ମର୍ଯ୍ୟାଦା ଲାଭ କଲା; କପିଳେନ୍ଦ୍ର ଦେବ ଦେଶର ରାଜା, ସାରଳାଦାସ ଭାଷାର ରାଜା।"],
["ପଞ୍ଚଦଶ ଶତକ ବେଳକୁ ଓଡ଼ିଆ ଭାଷା ଓ ଲିପି ପ୍ରତିଷ୍ଠିତ; ସାରଳା ବିଭିନ୍ନ ଭାରତୀୟ ଭାଷା ଓ ଲିପିର ନାମୋଲ୍ଲେଖ କରିଛନ୍ତି।"],
["ପ୍ରାକୃତ ଓ ଅପଭ୍ରଂଶ ସହ ନିବିଡ଼ ସମ୍ପର୍କ; ଦେଶଜ ଶବ୍ଦକୁ ସାହିତ୍ୟିକ ମର୍ଯ୍ୟାଦା।"],
["ଦେଶଜ ଶବ୍ଦ : ଅଏଁଳା, ଅଘୋର, ଅତିଅନ୍ତ, ଆବର, ଉଭା, ଏସନ, କଟାକ, କପୂର, କରତାର, କେବଣ, ଘରଣୀ, ଘାଟୋଇ, ଛଡ଼ା, ଝାଟୁଆ, ଠାକୁର, ଟିମ, ତମ, ଦାରେଗୀ, ଦୁତିଅ ଇତ୍ୟାଦି"],
["ଅଳଙ୍କାର ଶବ୍ଦ ଓ ଯୁଗ୍ମ ଶବ୍ଦର ପ୍ରୟୋଗ : ନିର୍ବାଣ, ଲହଲହ ଜିହ୍ୱା, ଗହ ଗହ ହସ, କୁଚକୁମ୍ଭ ଇତ୍ୟାଦି"]]],
["ଷୋଡ଼ଶ ଶତକର ଓଡ଼ିଆ ଭାଷା (ପୃ.୧୪–୧୫)",[
