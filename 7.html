<h1>କାରକ ଓ ବିଭକ୍ତି — ମାଇଣ୍ଡ ମ୍ୟାପ୍</h1>

<script>
function E(a,ex,why){return [a+" : "+ex,[["→ "+why]]]}
function Q(n,q,o,a,w){var L=["କ","ଖ","ଗ","ଘ"];var ch=o.map(function(x,i){return ["("+L[i]+") "+x]});ch.push(["ଉତ୍ତର ଦେଖ",[["✔ ("+L[a]+") "+o[a]+" — "+w]]]);return [n+". "+q,ch]}
var K=["କର୍ତ୍ତା","କର୍ମ","କରଣ","ସମ୍ପ୍ରଦାନ","ଅପାଦାନ","ଅଧିକରଣ"];
var D={1:["କାରକ ଓ ବିଭକ୍ତି (ସହଜ ସାର)",[
["୧. ମୂଳ ସୂତ୍ର (ଏତିକି ମନେ ରଖ)",[
["କାରକ = କ୍ରିୟା ସହ ବାକ୍ୟସ୍ଥ ପଦର ସମ୍ବନ୍ଧ — ୬ ପ୍ରକାର"],
["ବିଭକ୍ତି = ପଦ ଶେଷରେ ଲାଗୁଥିବା ଚିହ୍ନ, ଯାହାଦ୍ୱାରା ବଚନ ଓ କାରକ ଜଣାଯାଏ — ୭ ପ୍ରକାର"],
["କାରକ ↔ ବିଭକ୍ତି ମେଳ (କ୍ରମ ମନେ ରଖ)",[
["କର୍ତ୍ତା = ପ୍ରଥମା (୧) — ପ୍ରଶ୍ନ : କିଏ / କ'ଣ?"],
["କର୍ମ = ଦ୍ୱିତୀୟା (୨) — ପ୍ରଶ୍ନ : କାହାକୁ / କ'ଣ?"],
["କରଣ = ତୃତୀୟା (୩) — ପ୍ରଶ୍ନ : କ'ଣଦ୍ୱାରା / କିପରି?"],
["ସମ୍ପ୍ରଦାନ = ଚତୁର୍ଥୀ (୪) — ପ୍ରଶ୍ନ : କାହାକୁ ଦାନ?"],
["ଅପାଦାନ = ପଞ୍ଚମୀ (୫) — ପ୍ରଶ୍ନ : କେଉଁଠୁ ଅଲଗା?"],
["ସମ୍ବନ୍ଧ = ଷଷ୍ଠୀ (୬) — ପ୍ରଶ୍ନ : କାହାର? (ଏହା କାରକ ନୁହେଁ)"],
["ଅଧିକରଣ = ସପ୍ତମୀ (୭) — ପ୍ରଶ୍ନ : କେଉଁଠି / କେବେ / କେଉଁ ବିଷୟରେ?"]]],
["କାରକ ୬, ବିଭକ୍ତି ୭ କାହିଁକି? ସମ୍ବନ୍ଧପଦର କ୍ରିୟା ସହ ସମ୍ବନ୍ଧ ନାହିଁ, ତେଣୁ କାରକ ନୁହେଁ; ମାତ୍ର ଷଷ୍ଠୀ ବିଭକ୍ତି ଅଛି।"],
["ଗୋଟିଏ ବାକ୍ୟରେ ସବୁ କାରକ",[
["ମୁଖ୍ୟମନ୍ତ୍ରୀ ରବୀନ୍ଦ୍ର ମଣ୍ଡପରେ ସ୍ୱାଧୀନତା ଦିବସରେ ସରକାରଙ୍କ ପକ୍ଷରୁ ଶିକ୍ଷକମାନଙ୍କୁ ନିଜ ହାତରେ ମାନପତ୍ର ଦେଲେ।"],
["କିଏ ଦେଲେ? ମୁଖ୍ୟମନ୍ତ୍ରୀ — କର୍ତ୍ତା"],
["କ'ଣ ଦେଲେ? ମାନପତ୍ର — କର୍ମ"],
["କିପରି ଦେଲେ? ନିଜ ହାତରେ — କରଣ"],
["କାହାକୁ ଦେଲେ? ଶିକ୍ଷକମାନଙ୍କୁ — ସମ୍ପ୍ରଦାନ"],
["କାହା ପକ୍ଷରୁ? ସରକାରଙ୍କ ପକ୍ଷରୁ — ଅପାଦାନ"],
["କେଉଁଠି / କେବେ? ମଣ୍ଡପରେ / ଦିବସରେ — ଅଧିକରଣ (ସ୍ଥାନ / କାଳ)"]]]]],
["୨. କର୍ତ୍ତାକାରକ (ଯେ କ୍ରିୟା କରେ ବା କରାଏ)",[
["ସୂତ୍ର : କ୍ରିୟା ପୂର୍ବରେ 'କିଏ / କ'ଣ' ଲଗାଅ — ଫୁଲ ଫୁଟିଛି → କ'ଣ ଫୁଟିଛି? ଫୁଲ।"],
["ଚାରି ପ୍ରକାର",[
E("ମୁଖ୍ୟକର୍ତ୍ତା (ନିଜେ କରେ)","ଗାୟତ୍ରୀ ଗୀତ ଗାଉଛି।","ଗାଇବା କାମ ନିଜେ କରୁଛି।"),
E("ପ୍ରୟୋଜକ / ହେତୁକର୍ତ୍ତା (ଅନ୍ୟକୁ ଦେଇ କରାଏ)","ଶିକ୍ଷକ ଛାତ୍ରଦ୍ୱାରା ମୂର୍ତ୍ତି ଗଢ଼ାଇଲେ।","ଶିକ୍ଷକ ନିଜେ ଗଢ଼ୁନାହାନ୍ତି, କରାଉଛନ୍ତି।"),
E("ପ୍ରୟୋଜ୍ୟକର୍ତ୍ତା (ଯାହାକୁ ଦେଇ କରାଯାଏ)","ବାଲ୍ମୀକି ଲବକୁଶଙ୍କଦ୍ୱାରା ରାମାୟଣ ଶୁଣାଇଲେ।","'ଲବକୁଶ' ପ୍ରୟୋଜ୍ୟ; ଏଠାରେ ଦ୍ୱିତୀୟା ବା ତୃତୀୟା ବିଭକ୍ତି ହୁଏ।"),
E("ଉହ୍ୟକର୍ତ୍ତା (ଅଦୃଶ୍ୟ)","ସତ୍ୟ କହ। ସେଠାକୁ ଯାଅ।","ଆଦେଶରେ 'ତୁମେ' ଲୁଚିଥାଏ।")]],
["କର୍ତ୍ତା ହୋଇପାରୁଥିବା ପଦ : ବିଶେଷ୍ୟ, ସର୍ବନାମ, ବିଶେଷଣ, କୃଦନ୍ତ ପଦ, ଖଣ୍ଡବାକ୍ୟ, ବାକ୍ୟାଂଶ"]]],
["୩. କର୍ମକାରକ (କର୍ତ୍ତାର ଅଭିଲଷିତ ବସ୍ତୁ)",[
E("ଉଦାହରଣ","ଖାରବେଳ ମଗଧ ଜୟ କଲେ।","'ମଗଧ' ହିଁ ଲକ୍ଷ୍ୟ। ନାସ୍ତି ବାକ୍ୟରେ ମଧ୍ୟ କର୍ମ ଥାଏ (ଶିଶୁ କ୍ଷୀର ପିଉନାହିଁ)।"),
["ମୁଖ୍ୟକର୍ମ ଓ ଗୌଣକର୍ମ (ପରୀକ୍ଷାପ୍ରିୟ)",[
["ଉଦାହରଣ : ଛାତ୍ରମାନେ ଶିକ୍ଷକଙ୍କୁ ପ୍ରଶ୍ନ ପଚାରୁଛନ୍ତି।"],
["ପ୍ରଶ୍ନ = ମୁଖ୍ୟକର୍ମ (ଅପ୍ରାଣୀ, କ୍ରିୟା ପାଖରେ, ଚିହ୍ନ ନାହିଁ)"],
["ଶିକ୍ଷକଙ୍କୁ = ଗୌଣକର୍ମ (ପ୍ରାଣୀ, 'ଙ୍କୁ' ଚିହ୍ନ ଅଛି)"],
["ଚିହ୍ନା : ପ୍ରାଣୀବାଚକ + ଦ୍ୱିତୀୟା ଚିହ୍ନ = ଗୌଣ; ଅପ୍ରାଣୀବାଚକ + ଚିହ୍ନ ନାହିଁ = ମୁଖ୍ୟ"],
["ଆଉ ଏକ : ମାଆ ଶିଶୁକୁ ଦୁଧ ପିଆଉଛନ୍ତି — ଦୁଧ ମୁଖ୍ୟ, ଶିଶୁକୁ ଗୌଣ"]]],
E("ବାକ୍ୟ ମଧ୍ୟ କର୍ମ ହୁଏ","ସେ କେତେବେଳେ ଆସିବେ, ମୁଁ କହିବି।","'କ'ଣ କହିବି?' ପ୍ରଶ୍ନର ଉତ୍ତର ପୂରା ବାକ୍ୟ।")]],
["୪. କରଣକାରକ (କ୍ରିୟାର ପ୍ରଧାନ ସାଧନ)",[
E("ଉଦାହରଣ","ସ୍ୱାଗତିକା ତୂଳୀରେ ଚିତ୍ର ଆଙ୍କୁଛି।","ଆଙ୍କିବାର ସାଧନ 'ତୂଳୀ'।"),
E("ଉଦାହରଣ","ସୁଦର୍ଶନ ବାଲିଦ୍ୱାରା ମୂର୍ତ୍ତି ଗଢ଼ୁଛନ୍ତି।","'ବାଲି' ଗଢ଼ିବାର ପ୍ରଧାନ ସହାୟକ।")]],
["୫. ସମ୍ପ୍ରଦାନକାରକ (ଯାହାକୁ ଦାନ କରାଯାଏ)",[
E("ଉଦାହରଣ","ଭୋକିଲା ଭିକାରିକୁ ଖାଇବାକୁ ଦିଅ।","ଦାନ ପାଉଥିବା 'ଭିକାରି' ସମ୍ପ୍ରଦାନ।"),
["ଶର୍ତ୍ତ : ଗ୍ରହୀତା ବସ୍ତୁର ସମ୍ପୂର୍ଣ୍ଣ ଅଧିକାରୀ ନ ହେଲେ କର୍ମକାରକ",[
["ଧୋବାକୁ ଲୁଗା ଦିଅ — ଧୋବା ମାଲିକ ହେଉନାହିଁ, ଧୋଇବାକୁ ନେଉଛି; ତେଣୁ କର୍ମ"],
["ରାମ, ମୋ ବହିଟି ମୋତେ ଦିଅ — ଫେରସ୍ତ, ଦାନ ନୁହେଁ; ତେଣୁ କର୍ମ"]]]]],
["୬. ଅପାଦାନକାରକ (ଯାହାଠାରୁ ପୃଥକ୍ ହୁଏ)",[
E("ମୂଳ ଉଦାହରଣ","ନମିତା ନଳକୂଅରୁ ପାଣି ଆଣିଲା।","ପାଣି ନଳକୂଅରୁ ଅଲଗା ହେଲା।"),
["ଆଠ ଅର୍ଥ : ଆ-ବି-ର-ଉ-ମୁ-ଅ-ପ-ନି",[
["ଆରମ୍ଭ : ପହିଲି-କାର୍ତ୍ତିକରୁ ଭାଗବତପାଠ ଆରମ୍ଭ"],
["ବିରତି : ପାପକର୍ମରୁ ବିରତ ହୁଅ"],
["ରକ୍ଷା : ବିପଦରୁ ରକ୍ଷା କରନ୍ତି"],
["ଉତ୍ପତ୍ତି : ପଙ୍କରୁ ପଦ୍ମର ଜନ୍ମ"],
["ମୁକ୍ତି : ଋଣରୁ ମୁକ୍ତ ହେବା ଉଚିତ"],
["ଅନ୍ତର୍ଦ୍ଧାନ : ଦୃଷ୍ଟିପଥରୁ ଅନ୍ତର୍ହିତ ହେଲା"],
["ପରାଜୟ : ଗୁରୁ ଶିଷ୍ୟଠାରୁ ପରାଜୟ ଇଚ୍ଛା କରନ୍ତି"],
["ନିବାରଣ : ବନ୍ଧୁ ବନ୍ଧୁକୁ କୁମାର୍ଗରୁ ନିବାରଣ କରେ"]]]]],
["୭. ଅଧିକରଣକାରକ (ସ୍ଥାନ, କାଳ, ବିଷୟ)",[
E("ସ୍ଥାନାଧିକରଣ","ପୁରୀରେ ଶ୍ରୀମନ୍ଦିର ବିଦ୍ୟମାନ।","'କେଉଁଠି?' → ପୁରୀରେ।"),
E("କାଳାଧିକରଣ","କାର୍ତ୍ତିକ-ପୂର୍ଣ୍ଣିମାରେ ବୋଇତବନ୍ଦାଣ ହୁଏ।","'କେବେ?' → ପୂର୍ଣ୍ଣିମାରେ।"),
E("ବିଷୟାଧିକରଣ","ରାଧାକୃଷ୍ଣନ୍‌ଙ୍କର ଦର୍ଶନଶାସ୍ତ୍ରରେ ଗଭୀର ଜ୍ଞାନ ଥିଲା।","'କେଉଁ ବିଷୟରେ?' → ଦର୍ଶନଶାସ୍ତ୍ରରେ।")]],

["୧୪. ଷଷ୍ଠୀ ବିଭକ୍ତିର ବ୍ୟବହାର (୬)",[

["୧୫. ସପ୍ତମୀ ବିଭକ୍ତିର ବ୍ୟବହାର (୬)",[
