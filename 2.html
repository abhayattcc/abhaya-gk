["ତତ୍ସମ ଓ ତଦ୍ଭବ ଶବ୍ଦକୁ ଛାଡ଼ିଦେଲେ ଆହୁରି ଅନେକ ଶବ୍ଦ ଓଡ଼ିଆ ଶବ୍ଦଭଣ୍ଡାରକୁ ସମୃଦ୍ଧ କରିଛି। ଯେଉଁ ଶବ୍ଦଗୁଡ଼ିକର ମୂଳ ଉତ୍ପତ୍ତିସ୍ଥଳ ଏଯାଏଁ ନିରୂପିତ ହୋଇନାହିଁ।"],

["ବୈଦେଶିକ ଶବ୍ଦ (ପୃ.୩୩–୩୫)",[
