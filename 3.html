<h1>ବାକ୍ୟ, ପଦ ଓ ବିଶେଷ୍ୟ — ମାଇଣ୍ଡ ମ୍ୟାପ୍</h1>

<script>
var D={1:["ବାକ୍ୟ, ପଦ ଓ ପଦର ଶ୍ରେଣୀବିଭାଗ (ପୃ. ୩୭–୪୩)",[
["ପ୍ରାତିପଦିକ",[["ସାର୍ଥକ ବର୍ଣ୍ଣ ବା ବର୍ଣ୍ଣ ସମଷ୍ଟିକୁ ଶବ୍ଦ କହନ୍ତି; ଏହି ଶବ୍ଦକୁ ମଧ୍ୟ ପ୍ରାତିପଦିକ କୁହାଯାଏ।"],["ରାମ, ରମା, ଗଛ, ଗଗନ, ତୁମେ, ନଈ, ଦୟା ଓ ବହି ପ୍ରଭୃତି ଶବ୍ଦ ଏକ ଏକ ପ୍ରାତିପଦିକ।"]]],
["ବାକ୍ୟ",[
["ଉଦାହରଣ : (୧) ଦେଶକୁ ଭଲପାଇଲେ ଆମେ ପ୍ରକୃତ ଦେଶପ୍ରେମୀ ହୋଇପାରିବା। (୨) ମହାତ୍ମାଗାନ୍ଧି ହରିଜନମାନଙ୍କ ପାଇଁ ବିଭିନ୍ନ ସେବାକାର୍ଯ୍ୟ କରିଥିଲେ।"],
["ଯେ କୌଣସି ଭାବପ୍ରକାଶକ ପୂର୍ଣ୍ଣାଙ୍ଗ ଉକ୍ତିକୁ ବାକ୍ୟ କହନ୍ତି।"],
["'ଦେଶକୁ ଭଲ ପାଇଲେ ଆମେ...' ଓ 'ମହାତ୍ମାଗାନ୍ଧି ହରିଜନମାନଙ୍କ ପାଇଁ...' ଭାବବୋଧକ ପୂର୍ଣ୍ଣାଙ୍ଗ ଉକ୍ତି ନୁହେଁ, ତେଣୁ ବାକ୍ୟ ନୁହେଁ।"]]],
["ଅନୁଚ୍ଛେଦ",[["ପ୍ରବନ୍ଧକୁ ଭାଗଭାଗ କରି ଲେଖିଲେ ପ୍ରତ୍ୟେକ ଭାଗ ଅନୁଚ୍ଛେଦ। କେତେଗୁଡ଼ିଏ ବାକ୍ୟ ମିଶିଲେ ଏକ ଅନୁଚ୍ଛେଦ ହୁଏ।"],["ପୂର୍ବବର୍ତ୍ତୀ ବାକ୍ୟର ପରବର୍ତ୍ତୀ ବାକ୍ୟ ସହିତ ସମ୍ବନ୍ଧ ଥାଏ; ପ୍ରତ୍ୟେକ ଅନୁଚ୍ଛେଦରେ ଗୋଟିଏ ଭାବନା ବା ଚିନ୍ତାଧାରା ପ୍ରତିଫଳିତ।"],["ଭାବନାର ପରିପ୍ରକାଶକୁ ନେଇ ଅନୁଚ୍ଛେଦ ବଡ଼ ବା ସାନ ହୁଏ; ଅନୁଚ୍ଛେଦଦ୍ୱାରା ଲେଖା ସୁନ୍ଦର ଓ ସୁପାଠ୍ୟ ହୁଏ।"]]],
["ପଦ",[
["ଉଦାହରଣ : ଛାତ୍ରମାନେ ବିଜ୍ଞାନମେଳାରୁ ବସ୍‌ରେ ବିଦ୍ୟାଳୟକୁ ଫେରିଲେ। — ବାକ୍ୟଟିରେ ପାଞ୍ଚଟି ଅଂଶ : ଛାତ୍ରମାନେ, ବିଜ୍ଞାନମେଳାରୁ, ବସ୍‌ରେ, ବିଦ୍ୟାଳୟକୁ, ଫେରିଲେ।"],
["ବାକ୍ୟର ପ୍ରତ୍ୟେକ ଅଂଶକୁ ପଦ କୁହାଯାଏ।"],
["ମାନେ, ରୁ, ରେ, କୁ ପ୍ରଭୃତିକୁ ବାଦ୍ ଦେଲେ ପଦଗୁଡ଼ିକ କେବଳ ମୂଳଶବ୍ଦ ଆକାରରେ ରହେ : ଛାତ୍ର, ବିଜ୍ଞାନମେଳା, ବସ୍, ବିଦ୍ୟାଳୟ। ମୂଳଶବ୍ଦକୁ ପ୍ରାତିପଦିକ କହନ୍ତି।"],
["ଶବ୍ଦ (ପ୍ରାତିପଦିକ) ବାକ୍ୟରେ ବ୍ୟବହୃତ ହେଲେ ତାକୁ ପଦ କହନ୍ତି। ବାକ୍ୟରେ ବ୍ୟବହୃତ ଶବ୍ଦରେ କିଛି ଲାଗି ଥାଉ ବା ନ ଥାଉ ତାହା ପଦ (ରମେଶ ଶ୍ରେଣୀରେ ବହି ପଢୁଛି)।"],
["'ଫେରିଲେ' କ୍ରିୟାପଦ; ଏହା 'ଫେର୍' ରୁ ଆସିଅଛି — ଏହା ଏକ ଧାତୁ। ଯା, ପଢ଼୍, ହସ୍, ଖା — ଧାତୁ।"],
["ଶବ୍ଦ ଓ ଧାତୁକୁ ପ୍ରକୃତି କହନ୍ତି। ପ୍ରକୃତି ପରେ ଯେଉଁ ଚିହ୍ନ ବା ବର୍ଣ୍ଣ ସଂଯୁକ୍ତ ହୁଏ, ତାହାକୁ ବିଭକ୍ତି କହନ୍ତି। ବିଭକ୍ତିଯୁକ୍ତ ଶବ୍ଦ ଓ ଧାତୁକୁ ମଧ୍ୟ ପଦ କହନ୍ତି।"]]],
["ପଦର ଶ୍ରେଣୀବିଭାଗ",[["ବାକ୍ୟଗୁଡ଼ିକରେ ବ୍ୟବହୃତ ପଦକୁ ପାଞ୍ଚ ଭାଗରେ ବିଭକ୍ତ କରାଯାଇଛି :"],["ବିଶେଷ୍ୟ, ସର୍ବନାମ, ବିଶେଷଣ, କ୍ରିୟା ଓ ଅବ୍ୟୟ"]]],
["ବିଶେଷ୍ୟ",[
["ଲକ୍ଷ୍ୟ : (କ) ଦିଲୀପ ତିର୍କୀ ଓଡ଼ିଶାର ଜଣେ ଆନ୍ତର୍ଜାତିକ ହକି ଖେଳାଳି। (ଖ) କୃଷକ ଓ ସୈନିକମାନେ ଦେଶର ପ୍ରକୃତ ମେରୁଦଣ୍ଡ। (ଗ) ପଥର ଓ ମାଟିରେ ମୂର୍ତ୍ତି ନିର୍ମିତ ହୁଏ। (ଘ) ସେବା, ଦୟା ଓ ପରୋପକାର ମନୁଷ୍ୟ ଜୀବନକୁ ମହାନ୍ କରେ। (ଙ) କହିବାଠାରୁ କରିବା କଠିନ।"],
["ଦିଲୀପ ଜଣେ ହକି ଖେଳାଳିର ନାମ; ଓଡ଼ିଶା ରାଜ୍ୟର ନାମ; କୃଷକ ଓ ସୈନିକ ସାଧାରଣ ନାମ; ପଥର ଓ ମାଟି ବସ୍ତୁର ନାମ; ସେବା, ଦୟା ଓ ପରୋପକାର ମନୁଷ୍ୟର ସୁଗୁଣର ନାମ; କହିବା, କରିବା କାର୍ଯ୍ୟର ନାମ।"],
["ଅତଏବ ନାମବାଚକ ପଦକୁ ବିଶେଷ୍ୟ ପଦ କହନ୍ତି।"],
["ବିଶେଷ୍ୟ ପ୍ରକାର : ନାମର ପ୍ରକାରକୁ ନେଇ ବିଶେଷ୍ୟ ପଦକୁ ପାଞ୍ଚ ଶ୍ରେଣୀରେ ବିଭକ୍ତ କରାଯାଏ।",[
["ବ୍ୟକ୍ତିବାଚକ ବା ସଂଜ୍ଞାବାଚକ — ଦେବାଶିଷ, କପିଳାସ, କଟକ, କାବେରୀ, ମହାଭାରତ"],
["ଜାତିବାଚକ — ଛାତ୍ର, ପର୍ବତ, ସହର, ନଦୀ, ଗ୍ରନ୍ଥ"],
["ବସ୍ତୁବାଚକ — ମାଟି, କାଠ, ଲୁହା, ପାଣି, କୋଇଲା"],
["ଗୁଣବାଚକ — ଅହିଂସା, ସତ୍ୟ, ସରଳତା, ବାର୍ଦ୍ଧକ୍ୟ, ଦାରିଦ୍ର୍ୟ"],
["କ୍ରିୟାବାଚକ — ଲେଖା, ପଢ଼ା, ଭୋଜନ, ହସ, ଖେଳ"]]]]],
["ବ୍ୟକ୍ତିବାଚକ ବା ସଂଜ୍ଞାବାଚକ ବିଶେଷ୍ୟ",[
["ନିର୍ଦ୍ଦିଷ୍ଟ ନାମ ପ୍ରକାଶ କରୁଥିବା ପଦଗୁଡ଼ିକ ବ୍ୟକ୍ତିବାଚକ ବିଶେଷ୍ୟ। ନାମକୁ ମଧ୍ୟ ସଂଜ୍ଞା କୁହାଯାଏ; ତେଣୁ ଅନ୍ୟ ନାମ ସଂଜ୍ଞାବାଚକ ବିଶେଷ୍ୟ।"],
["ନିର୍ଦ୍ଦିଷ୍ଟ ବ୍ୟକ୍ତି, ସ୍ଥାନ, ସହର, ପର୍ବତ, ବନ, ପଶୁପକ୍ଷୀ, ସମୁଦ୍ର, ହ୍ରଦ, ନଦୀ, ଗ୍ରନ୍ଥ, ଦେଶ ଓ ପ୍ରଦେଶର ନାମକୁ ବୁଝାଇଥାଏ।"],
["ବ୍ୟକ୍ତି : ବିବେକାନନ୍ଦ, ମନମୋହନ, ଗୌରୀ, ଈଶାନୀ, ଶତରୂପା, ଅନନ୍ୟା, ମଧୁସୂଦନ, ବ୍ୟୋମକେଶ, ଗୋଦାବରୀଶ"],
["ସହର/ସ୍ଥାନ : ପୁରୀ, ହରିଦ୍ୱାର, ଦିଲ୍ଲୀ, ସମ୍ବଲପୁର, ଚେନ୍ନାଇ, ଗୋପାଳପୁର"],
["ନଦୀ : ମହାନଦୀ, ରୁଷିକୁଲ୍ୟା, ଗଙ୍ଗା, ଯମୁନା, କୃଷ୍ଣା | ପର୍ବତ : ହିମାଳୟ, ବିନ୍ଧ୍ୟ, ଗନ୍ଧମାର୍ଦ୍ଦନ, ମାଳ୍ୟବନ୍ତ"],
["ଦେଶ : ଭାରତ, ନେପାଳ, ଚୀନ, ଇରାକ, ମରକ୍କୋ, ଇଟାଲୀ, ପାକିସ୍ତାନ | ସାଗର : ଆରବସାଗର, ଭୂମଧ୍ୟସାଗର, ମରୁସାଗର | ହ୍ରଦ : ଚିଲିକା, ଅଂଶୁପା, କାସ୍ପିଆନ"],
["ଗ୍ରନ୍ଥ : ରାମଚରିତ ମାନସ, ରଘୁବଂଶମ୍, ନୈଷଧ, ଶ୍ରୀମଦ୍ ଭଗବଦ୍ ଗୀତା, ବାଇବେଲ"]]],
["ଜାତିବାଚକ ବିଶେଷ୍ୟ",[
["ଯେଉଁ ପଦ କୌଣସି ନିର୍ଦ୍ଦିଷ୍ଟ ନାମକୁ ନ ବୁଝାଇ ଅନେକଙ୍କର ସାଧାରଣ ନାମକୁ ପ୍ରକାଶ କରିଥାଏ, ତାକୁ ଜାତିବାଚକ ବିଶେଷ୍ୟ କହନ୍ତି। ଜାତି ଅର୍ଥ ସମୂହ।"],
