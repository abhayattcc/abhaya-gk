<title>ବିଶେଷଣ ମାଇଣ୍ଡ ମ୍ୟାପ୍ (ପୃ.୫୧–୬୦)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&display=swap">
<style>
:root{--bg:#fafaf7;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#e3e3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#e8e8e3;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Oriya","Kalinga","Nirmala UI",system-ui,sans-serif;font-size:15px;line-height:1.7;padding:14px 12px 40px}
h1{font-size:18px;margin:0 0 10px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:4px 14px;cursor:pointer}
button.on{background:#6c5ce7;color:#fff;border-color:#6c5ce7}
.root{display:block;width:fit-content;max-width:100%;margin:0 auto 12px;background:#6c5ce7;color:#fff;font-weight:700;padding:8px 18px;border-radius:24px;text-align:center}
.n{position:relative}
.t{display:inline-block;padding:2px 10px;border-radius:8px;margin:2px 0;background:var(--card);border:1px solid var(--bd)}
.t.p{cursor:pointer}
.t.p::after{content:" ▾";color:var(--mut);font-size:12px}
.n.c>.t.p::after{content:" ▸"}
.k{margin-left:14px;padding-left:12px;border-left:2px solid var(--c,var(--bd))}
.n.c>.k{display:none}
.k>.n::before{content:"";position:absolute;left:-12px;top:15px;width:10px;border-top:2px solid var(--c,var(--bd))}
.b{margin-bottom:10px}
.b>.t{background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.b>.t.p::after{color:#fff}
.b>.k{border-left-color:var(--c)}
.b .n{--c:inherit}
.b .k,.b .k>.n::before{--cc:var(--c)}
.b .k{border-left-color:var(--c)}
.b .k>.n::before{border-top-color:var(--c)}
.b .t{border-color:var(--c)}
.b>.t{border-color:var(--c)}
</style>
</head>

<script>
var D={1:["ବିଶେଷଣ (ପୃ. ୫୧–୬୦)",[
["ବିଶେଷଣର ଧାରଣା",[
["ଉଦାହରଣ : ସାଧୁ ଲୋକ ସବୁଠାରେ ସମ୍ମାନ ପାଏ। | ଚିରା ଓ ମଇଳା ପୋଷାକ ପିନ୍ଧ ନାହିଁ। | ପ୍ରିୟଦର୍ଶୀ ମାସକୁ ଶହେ ଟଙ୍କା ବୃଦ୍ଧି ପାଏ। | ବାପା ଦିନକୁ ଲିଟରେ ଦୁଧ ପିଅନ୍ତି। | ଶାଶ୍ୱତୀ ସପ୍ତମ ଶ୍ରେଣୀରେ ପଢ଼େ।"],
["ସାଧୁ (ଗୁଣ), ଚିରା-ମଇଳା (ଅବସ୍ଥା), ଶହେ (ସଂଖ୍ୟା), ଲିଟରେ (ପରିମାଣ), ସପ୍ତମ (ନିର୍ଦ୍ଦିଷ୍ଟତା)।"],
["ଯେଉଁ ପଦ ଅନ୍ୟ ପଦର ଗୁଣ, ଅବସ୍ଥା, ସଂଖ୍ୟା, ପରିମାଣ ଓ ନିର୍ଦ୍ଦିଷ୍ଟତା ପ୍ରକାଶ କରେ, ତାକୁ ବିଶେଷଣ ପଦ କହନ୍ତି।"]]],
["ବିଶେଷଣର ପ୍ରକାର (ନାମ ଓ ଭାବ ଦୃଷ୍ଟିରେ)",[
["ନାମ ବିଶେଷଣ : ବିଶେଷ୍ୟ ଓ ସର୍ବନାମ ପଦକୁ ବିଶେଷିତ କରୁଥିବା ବିଶେଷଣ। ବିଶେଷ୍ୟର ବିଶେଷଣ, ସର୍ବନାମର ବିଶେଷଣ, ସଂଖ୍ୟାବାଚକ ଓ ପୂରଣବାଚକ ବିଶେଷଣ ନାମ ବିଶେଷଣର ଅନ୍ତର୍ଗତ।"],
["ଭାବ ବିଶେଷଣ : କ୍ରିୟାକୁ ବିଶେଷିତ କରୁଥିବା ବିଶେଷଣ। ବିଶେଷଣ, ଅବ୍ୟୟ ଓ ବାକ୍ୟକୁ ବିଶେଷିତ କରୁଥିବା ପଦ ମଧ୍ୟ ଭାବ ବିଶେଷଣର ଅନ୍ତର୍ଭୁକ୍ତ।"],
["କାର୍ଯ୍ୟ ଓ ଅବସ୍ଥିତି ଦୃଷ୍ଟିରୁ ବିଶେଷଣକୁ ବିଭିନ୍ନ ଭାବରେ ବିଭକ୍ତ କରାଯାଏ (ତଳେ ୧୫ ପ୍ରକାର)।"]]],
["୧. ଗୁଣବାଚକ ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ ବିଶେଷ୍ୟ ପଦର ଗୁଣ ପ୍ରକାଶ କରେ। ଏହାକୁ ମଧ୍ୟ ବିଶେଷ୍ୟର ବିଶେଷଣ କହନ୍ତି।"],["ରକ୍ତ ମନ୍ଦାର, ମଧୁର ବଚନ, ମହତ୍ ଜନ, ନୀଳ ନୟନ, ପଣ୍ଡିତ ଲୋକ, ଦୟାଳୁ ରାଜା, ବିକାଶଶୀଳ ରାଷ୍ଟ୍ର, ଜନପ୍ରିୟ ନେତା, ମିଥ୍ୟାବାଦୀ ମଣିଷ, ଭୋକିଲା ଭିକାରି"]]],
["୨. ଅବସ୍ଥାବାଚକ ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ ବିଶେଷ୍ୟ ପଦର ଅବସ୍ଥା ସୂଚାଏ।"],["ଦୁର୍ବଳ ଶରୀର, ଅସୁସ୍ଥ ମନ, ଭଙ୍ଗା ଦେଉଳ, କୋହଳା ପାଗ, ମେଘୁଆ ଆକାଶ, ବେଗବତୀ ନଦୀ, କାଦୁଆ ରାସ୍ତା, ଶୁଖିଲା ଜମି, ଦରିଦ୍ର ସୁଦାମା, ପାଚିଲା ଆମ୍ବ, ପାଣିଆ ଡାଲି, ତଟକା ମାଛ, ସଜ ପରିବା"],["ଗୁଣବାଚକ କି ଅବସ୍ଥାବାଚକ ନିର୍ଣ୍ଣୟରେ ସନ୍ଦେହ ହେଲେ (ଅନ୍ଧାର, ହତାଶ, କଠିନ, ମୁକ୍ତ, ଅସମ୍ପୂର୍ଣ୍ଣ, ସ୍ୱାଧୀନ, ନୂଆ, ଉତ୍ସାହୀ) କେହିକେହି ଉଭୟକୁ ଗୁଣବାଚକ ରୂପେ ଗ୍ରହଣ କରନ୍ତି।"]]],
["୩. ସଂଖ୍ୟାବାଚକ ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ ବିଶେଷ୍ୟ ପଦର ସଂଖ୍ୟା ସୂଚାଏ।"],["ବାର ମାସରେ ତେର ଯାତ୍ରା। | ଓଡ଼ିଶା ବିଧାନସଭାରେ ଶହେ ସତଚାଳିଶ ବିଧାୟକ ଅଛନ୍ତି। | ସହସ୍ର ଦେବାଳୟ, ଅଗଣିତ ତାରକା, ଅସଂଖ୍ୟ ଭାବନା।"]]],
["୪. ପରିମାଣବାଚକ ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ ବିଶେଷ୍ୟ ପଦର ପରିମାଣ ବୁଝାଏ।"],["କମ୍ କଥା କହ, ବେଶି କାମ କର। | ବହୁତ ଲୋକ ଯହିଁ ମିଳି, ଅବଶ୍ୟ ଉପୁଜଇ କଳି। | ଅଳପ ଧନ, ବିକଳ ମନ, ଅମାପ ଶକ୍ତି, ବୋଝେ ଆମ୍ବ।"],["ଅନ୍ୟ ଉଦାହରଣ : ପୋଷେ, ଗୋଟାଏ, ଆଞ୍ଜୁଳାଏ, ମୁହୂର୍ତ୍ତେ, ପ୍ରଭୂତ, ପ୍ରଚୁର, ବସ୍ତାଏ, ହେକୁରେ, ସାମାନ୍ୟ, ଢୋକେ"]]],
["୫. ପୂରଣବାଚକ ବିଶେଷଣ",[
["ଯେଉଁ ବିଶେଷଣ ପଦ ସଂଖ୍ୟାକୁ ନିଷ୍ପନ୍ନ ହୋଇ ସଂଖ୍ୟାର କ୍ରମିକତା ପ୍ରକାଶ କରିବା ସହିତ ବିଶେଷ୍ୟ ପଦର ନିର୍ଦ୍ଦିଷ୍ଟତା ପ୍ରକାଶ କରେ।"],
["(କ) ପଞ୍ଚ ପାଣ୍ଡବଙ୍କ ମଧ୍ୟରେ ସହଦେବ ପଞ୍ଚମ ପାଣ୍ଡବ ଅଟନ୍ତି। (ଖ) ରାକେଶ ମାଟ୍ରିକ୍ ପରୀକ୍ଷାରେ ପ୍ରଥମ ଶ୍ରେଣୀରେ ଉତ୍ତୀର୍ଣ୍ଣ। (ଗ) ଭାଗବତର ତୃତୀୟ ସ୍କନ୍ଧରେ କପିଳଙ୍କ ଜନ୍ମବୃତ୍ତାନ୍ତ। (ଘ) ଚତୁର୍ଥ ଧାଡ଼ିରେ ବସିଥିବା ଦ୍ୱିତୀୟ ବ୍ୟକ୍ତି ମୋର ବାପା।"],
["କେତେକ ସଂଖ୍ୟାର ପୂରଣବାଚକ ରୂପ",[["୧ ପ୍ରଥମ | ୨ ଦ୍ୱିତୀୟ | ୩ ତୃତୀୟ | ୪ ଚତୁର୍ଥ | ୫ ପଞ୍ଚମ | ୬ ଷଷ୍ଠ | ୭ ସପ୍ତମ | ୮ ଅଷ୍ଟମ | ୯ ନବମ | ୧୦ ଦଶମ"],["୧୧ ଏକାଦଶ | ୧୨ ଦ୍ୱାଦଶ | ୧୩ ତ୍ରୟୋଦଶ | ୧୪ ଚତୁର୍ଦ୍ଦଶ | ୧୫ ପଞ୍ଚଦଶ | ୧୬ ଷୋଡ଼ଶ | ୧୭ ସପ୍ତଦଶ | ୧୮ ଅଷ୍ଟାଦଶ | ୧୯ ଊନବିଂଶ | ୨୦ ବିଂଶ"],["୨୧ ଏକବିଂଶ | ୨୨ ଦ୍ୱାବିଂଶ | ୨୩ ତ୍ରୟୋବିଂଶ | ୨୪ ଚତୁର୍ବିଂଶ | ୨୫ ପଞ୍ଚବିଂଶ | ୨୬ ଷଡ଼ବିଂଶ | ୨୭ ସପ୍ତବିଂଶ | ୨୮ ଅଷ୍ଟାବିଂଶ | ୨୯ ଊନତ୍ରିଂଶ"],["୩୦ ତ୍ରିଂଶ | ୪୦ ଚତ୍ୱାରିଂଶ | ୫୦ ପଞ୍ଚାଶତ୍ତମ | ୬୦ ଷଷ୍ଠିତମ | ୭୦ ସପ୍ତତିତମ | ୮୦ ଅଶୀତିତମ | ୯୦ ନବତିତମ | ୧୦୦ ଶତତମ | ୧୦୦୦ ସହସ୍ରତମ | ୧୦୦୦୦୦ ଲକ୍ଷତମ | ୧୦୦୦୦୦୦୦ କୋଟିତମ"]]]]],
["୬. ବିଶେଷଣର ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ଅନ୍ୟ ଏକ ବିଶେଷଣର ଗୁଣ, ମାତ୍ରା, ଅବସ୍ଥା ବା ଆଧିକ୍ୟ ପ୍ରକାଶ କରେ।"],["ପରମ ଧାର୍ମିକ ଯୁଧିଷ୍ଠିର, ଅତି ମନୋହର କାଳ, ବଡ଼ କୁହାଳିଆ ଲୋକ, ଅଧିକ ଗରମ ପବନ, ଭାରି ମଜା କାହାଣୀ, ଅତ୍ୟନ୍ତ କଟୁ କଥା, ନିହାତି ଦୁଷ୍ଟ ପିଲା, ନିପଟ ମଫସଲିଆ ଲୋକ"]]],
["୭. କ୍ରିୟା ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ କ୍ରିୟା ପଦକୁ ବିଶେଷିତ କରେ ଅଥବା କ୍ରିୟାର ଗୁଣ, ଅବସ୍ଥା ପ୍ରକାଶ କରେ।"],["ବୁଢ଼ା ଧୀରେ ଚାଲୁଛି। | ନିଆଁ ହୁତୁହୁତୁ ଜଳୁଛି। | ପିଲାଟି ଜୋରରେ କାନ୍ଦୁଛି। | ତୁମେ ସଢ଼ଳ ଆସିବ। | ଦୀପ ମିଞ୍ଜିମିଞ୍ଜି ଜଳୁଛି। | ପବନ ମନ୍ଦମନ୍ଦ ବହୁଛି। | ହରିଣ ଚଞ୍ଚଳ ଦୌଡ଼ିପାରେ। | ସମୁଦ୍ର ଘୁଘୁ ଗର୍ଜୁଛି।"],["ସ୍ୱତନ୍ତ୍ର ଅଧ୍ୟାୟରେ କ୍ରିୟାବିଶେଷଣ ସଂପର୍କରେ ଆଲୋଚନା କରାଯିବ।"]]],
["୮. କ୍ରିୟାବିଶେଷଣର ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ କ୍ରିୟାବିଶେଷଣ ପଦକୁ ବିଶେଷିତ କରେ।"],["ଶୈଳେଶ ଅତି ବେଗରେ ଦୌଡ଼ୁଛି। | ଖୁବ୍ ଜୋରରେ ପବନ ବହୁଛି। — 'ଅତି' ଓ 'ଖୁବ୍'"]]],
["୯. କ୍ରିୟାଜ ବିଶେଷଣ",[
["କ୍ରିୟାରୁ ଜାତ ବା ଗଠିତ ବିଶେଷଣ ପଦ ବିଶେଷ୍ୟ ପଦକୁ ବିଶେଷିତ କରୁଥିଲେ ତାକୁ କ୍ରିୟାଜ ବିଶେଷଣ କହନ୍ତି। ଧାତୁ ବା କ୍ରିୟାର ମୂଳ ଉତ୍ସରେ ପ୍ରତ୍ୟୟ ଯୋଗଦ୍ୱାରା ଗଠିତ; କୃଦନ୍ତ ପଦ।"],
["ପାଗଳଟି ଚଳନ୍ତା ଗାଡ଼ିରୁ ପଡ଼ିଗଲା (ଚଲ୍+ଅନ୍ତା) | ଉଡ଼ନ୍ତା ଚଡ଼େଇ (ଉଡ଼୍+ଅନ୍ତା) | ଜଳନ୍ତା ନିଆଁ (ଜଲ୍+ଅନ୍ତା)"],
["ବହନ୍ତା ନଈ, ଜୀଅନ୍ତା ମାଛ, ବଢ଼ନ୍ତା ଶିଶୁ, ଫୁଟନ୍ତା ଫୁଲ, ମଲା ପୁଅର ଗଳାମୋଟ, ହଜିଲା ବଳଦ, ଖୋଜିଲା ଭେଣ୍ଟି, କହିବା ଲୋକ, ସହିବା ମହତ ଜନ, ଖାଇବାର ବେଳ, କହୁଥିବା, ଶୁଣୁଥିବା, ପଢ଼ିଥିବା"]]],
["୧୦. ସାର୍ବନାମିକ ବିଶେଷଣ ବା ସର୍ବନାମ ବିଶେଷଣ",[["ସର୍ବନାମ ପଦ ବିଶେଷ୍ୟ ପଦକୁ ନିର୍ଦ୍ଦେଶ କଲେ, ତାକୁ ସାର୍ବନାମିକ ବିଶେଷଣ କହନ୍ତି; ଅର୍ଥାତ୍ ସର୍ବନାମ ପଦ ବିଶେଷଣର କାର୍ଯ୍ୟ କଲେ।"],["କି ଥିଲା ଏ ରାଜ୍ୟ। | ଏଇ କଥାକୁ। | ଏହି ଦେଶ ଆମ ଭାରତ। | ସେହି କଥାରେ ମୁଣ୍ଡ ପୂରାଅ ନାହିଁ। | କେଉଁ କଲମଟି ତୁମର? | ଏପରି ଘଟଣା। | ଏମନ୍ତ ବିଚାର। | ସେପରି ଲୋକ, ଯେମିତି କାମ ସେମିତି ଫଳ।"]]],
["୧୧. ସର୍ବନାମର ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ ସର୍ବନାମ ପଦର ପରେ ବ୍ୟବହୃତ ହୋଇ ସର୍ବନାମ ପଦକୁ ବିଶେଷିତ କରେ।"],["ସେ ଧାର୍ମିକ। | ତୁମେ ପରୋପକାରୀ। | ମୁଁ ନିର୍ଭୀକ। | ଆପଣମାନେ ଦେଶପ୍ରେମୀ। | ଆମ୍ଭେମାନେ ଧନୀ ନୋହୁ।"],["ସାର୍ବନାମିକ ବିଶେଷଣରେ ସର୍ବନାମ ପଦ ବିଶେଷ୍ୟ ପଦ ପୂର୍ବରୁ ରହି ବିଶେଷଣର କାର୍ଯ୍ୟ କରେ; ସର୍ବନାମର ବିଶେଷଣରେ ବିଶେଷଣ ପଦ ସର୍ବନାମ ପଦ ପରେ ରହି ସର୍ବନାମକୁ ବିଶେଷିତ କରିଥାଏ।"]]],
["୧୨. ଅବ୍ୟୟର ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ ଅବ୍ୟୟ ପଦକୁ ବିଶେଷିତ କରେ।"],["(୧) ଜଗନ୍ନାଥ ଦାସ ସ୍ୱପ୍ନରେ ଦେଖିଲେ, ଠିକ୍ ଯେମିତି ନିଜେ ଜଗନ୍ନାଥ ତାଙ୍କ ସମ୍ମୁଖରେ ଠିଆହୋଇ କହୁଛନ୍ତି। (୨) ପୁଅଟି ଅବିକଳ ତା ବାପ ପରି।"]]],
["୧୩. ବାକ୍ୟର ବିଶେଷଣ",[["ଯେଉଁ ବିଶେଷଣ ପଦ ଗୋଟିଏ ବାକ୍ୟର ଅର୍ଥକୁ ବିଶେଷିତ କରେ।"],["(୧) ନିଶ୍ଚୟ ମୁଁ ଏ ବର୍ଷ ରାମେଶ୍ୱର ଯିବି। (୨) ସତେ ଭାରତ ହକିରେ ପୂର୍ବ ଗୌରବ ଫେରିପାଇବ? (୩) ଅବଶ୍ୟ ଦିନେ ନା ଦିନେ ଓଡ଼ିଶାର ଦାରିଦ୍ର୍ୟ ଦୂର ହେବ। — ନିଶ୍ଚୟ, ସତେ, ଅବଶ୍ୟ"]]],
["୧୪. ତୁଳନାତ୍ମକ ବିଶେଷଣ",[
["ଦୁଇ ବା ତତୋଽଧିକ ବିଶେଷ୍ୟ ପଦ ମଧ୍ୟରେ ତୁଳନା କରିବାପାଇଁ ଯେଉଁ ବିଶେଷଣ ପଦ ବ୍ୟବହୃତ ହୁଏ।"],
["ରାମ ହରିଠାରୁ ଉଚ୍ଚତାରେ କ୍ଷୁଦ୍ରତର। | ପୂର୍ଣ୍ଣେନ୍ଦୁ ଶ୍ରେଣୀରେ କ୍ଷୁଦ୍ରତମ ବାଳକ। | ବିନ୍ଧ୍ୟ ପର୍ବତ କପିଳାସଠାରୁ ଉଚ୍ଚତର। | ହିମାଳୟ ପୃଥିବୀର ଉଚ୍ଚତମ ପର୍ବତ। | ସାଧାରଣ ଜୀବନ ଅପେକ୍ଷା ଦେଶ ସେବାରେ ଜୀବନ ହୁଏ ମହୀୟାନ୍। | ସଂଖ୍ୟା ଗରିଷ୍ଠ ମତ ଗଣତନ୍ତ୍ରକୁ ସୁଦୃଢ଼ ଓ ସଫଳ କରେ।"],
["'କ୍ଷୁଦ୍ରତର' = ଦୁଇଜଣଙ୍କ ମଧ୍ୟରେ କ୍ଷୁଦ୍ର; 'କ୍ଷୁଦ୍ରତମ' = ସମସ୍ତଙ୍କ ମଧ୍ୟରେ କ୍ଷୁଦ୍ର। ତୁଳନାତ୍ମକ ବିଶେଷଣ ତତ୍ସମ ବିଶେଷଣ ପଦରୁ ନିଷ୍ପନ୍ନ।"],
["(କ) 'ତର' ଓ 'ତମ' ପ୍ରତ୍ୟୟ",[["ମୂଳ → ତର (ଦୁଇ ମଧ୍ୟରେ) → ତମ (ଅନେକଙ୍କ ମଧ୍ୟରେ)"],["ମଧୁର → ମଧୁରତର → ମଧୁରତମ | ସୁନ୍ଦର → ସୁନ୍ଦରତର → ସୁନ୍ଦରତମ | ଚତୁର → ଚତୁରତର → ଚତୁରତମ"],["ନିକଟ → ନିକଟତର → ନିକଟତମ | ବୃହତ୍ → ବୃହତ୍ତର → ବୃହତ୍ତମ | ମହତ୍ → ମହତ୍ତର → ମହତ୍ତମ"],["ପ୍ରାଚୀନ → ପ୍ରାଚୀନତର → ପ୍ରାଚୀନତମ | ସାମାନ୍ୟ → ସାମାନ୍ୟତର → ସାମାନ୍ୟତମ | ବଳବତ୍ → ବଳବତ୍ତର → ବଳବତ୍ତମ"],["ଗୁରୁ → ଗୁରୁତର → ଗୁରୁତମ | ଲଘୁ → ଲଘୁତର → ଲଘୁତମ | କ୍ଷିପ୍ର → କ୍ଷିପ୍ରତର → କ୍ଷିପ୍ରତମ | ଦୀର୍ଘ → ଦୀର୍ଘତର → ଦୀର୍ଘତମ"],["ଉଚ୍ଚ → ଉଚ୍ଚତର → ଉଚ୍ଚତମ | ନିକୃଷ୍ଟ → ନିକୃଷ୍ଟତର → ନିକୃଷ୍ଟତମ | ଦୃଢ଼ → ଦୃଢ଼ତର → ଦୃଢ଼ତମ | ପ୍ରିୟ → ପ୍ରିୟତର → ପ୍ରିୟତମ"]]],
["(ଖ) 'ଈୟସ୍/ଈୟାନ୍' ଓ 'ଇଷ୍ଠ' ପ୍ରତ୍ୟୟ",[["ଗୁରୁ → ଗରୀୟାନ୍ → ଗରିଷ୍ଠ | ଲଘୁ → ଲଘୀୟାନ୍ → ଲଘିଷ୍ଠ | ବର → ବରୀୟାନ୍ → ବରିଷ୍ଠ | ମହତ୍ → ମହୀୟାନ୍ → ମହିଷ୍ଠ"],["ବୃଦ୍ଧ → ବର୍ଷୀୟାନ୍, ଜ୍ୟାୟାନ୍ → ବର୍ଷିଷ୍ଠ, ଜ୍ୟେଷ୍ଠ | ବଳବାନ୍ → ବଳୀୟାନ୍ → ବଳିଷ୍ଠ | ଦର୍ପୀ → ଦର୍ପୀୟାନ୍ → ଦର୍ପିଷ୍ଠ"],["ଯୁବା → ଯବୀୟାନ୍/କନୀୟାନ୍ → ଯବିଷ୍ଠ/କନିଷ୍ଠ | ଦୃଢ଼ → ଦ୍ରଢ଼ୀୟାନ୍ → ଦ୍ରଢ଼ିଷ୍ଠ"]]]]],
["୧୫. ବିଧେୟ ବିଶେଷଣ",[
["ବିଶେଷଣ ପଦ ବିଶେଷ୍ୟ ପଦର ପରେ ବ୍ୟବହୃତ ହେଲେ, ତାକୁ ବିଧେୟ ବିଶେଷଣ କୁହାଯାଏ।"],
["ରାମଚନ୍ଦ୍ର ପ୍ରଜାନୁରଞ୍ଜକ ଓ ସତ୍ୟପାଳକ ଥିଲେ। | ଯୁଧିଷ୍ଠିର ଧାର୍ମିକ ଥିଲେ। | ଗାଡ଼ିରେ ତେଲ ଅଳ୍ପ ଅଛି। | ପିଲାଟିର ବ୍ୟବହାର ସୁନ୍ଦର। | ଆଜିର ପାଗ ନିର୍ମଳ। | ଏ ଛୁଆଟି ନୂଆ। | ଘର ବୁଡ଼ି ପାଣି ଆଣ୍ଠୁଏ।"],
["ବିଶେଷ୍ୟ ପଦର ବିଶେଷଣ ରୂପେ ବ୍ୟବହାର",[
["(କ) ଦୁଇଟି ବିଶେଷ୍ୟ ପଦ ମଧ୍ୟରୁ ପ୍ରଥମଟି ଦ୍ୱିତୀୟ ବିଶେଷ୍ୟ ପଦକୁ ବିଶେଷିତ କରିଥାଏ : ଟିଣ ଘର, ଛାତ ଘରଠାରୁ ଅଧିକ ଗରମ; ଶରତ୍ ରତୁରେ ଆକାଶ ନିର୍ମଳ; ସୁନା ହାରଟି; ଇଟା ଦେଉଳ; ମାଟି ହାଣ୍ଡି; ହେମ ହରିଣୀ।"],
["ଅନ୍ୟ ଉଦାହରଣ : ଡିଜେଲ ଗାଡ଼ି, ବର ଗଛ, ପର କଲମ, ଡାକ ଘର, ରୋହି ମାଛ, ମଲ୍ଲୀ ଫୁଲ, ଡବା କ୍ଷୀର, ଚମଡ଼ା ବ୍ୟାଗ୍, ଓଡ଼ିଆ ଭାଷା, ପଥର ଖଣି"],
